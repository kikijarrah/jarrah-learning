{% extends 'base.html' %}{% block body %}<section class='auth-view' style='display:block'><form class='auth-card' method='post'><p class='eyebrow'>{{role|upper}} PORTAL</p><h2>Welcome back.</h2><label>Email<input name='email' type='email' required></label><label>Password<input name='password' type='password' required></label><button class='btn dark full'>Log in</button>{% if role=='student' %}<p class='auth-switch'>New? <a href='{{url_for("signup_student")}}'>Create a student account</a></p>{% elif role=='tutor' %}<p class='auth-switch'>New? <a href='{{url_for("signup_tutor")}}'>Apply as a tutor</a></p>{% endif %}</form></section>{% endblock %}
