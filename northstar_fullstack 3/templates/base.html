<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>{% block title %}Northstar Tutoring{% endblock %}</title><link rel='stylesheet' href='{{ url_for("static",filename="styles.css") }}'></head><body>
<header class='site-header'><a class='logo' href='{{ url_for("home") }}'><span class='logo-mark'>N</span><span>NORTHSTAR</span></a><nav><a href='{{ url_for("home") }}#how'>How it works</a>{% if user %}<a href='{{ url_for(user["role"] + "_dashboard") }}'>Dashboard</a><a href='{{ url_for("logout") }}'>Log out</a>{% else %}<a href='{{ url_for("login",role="student") }}'>Student</a><a href='{{ url_for("login",role="tutor") }}'>Tutor</a><a href='{{ url_for("login",role="admin") }}'>Admin</a>{% endif %}</nav></header>
{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class='flashwrap'>{% for c,m in messages %}<div class='flash {{c}}'>{{m}}</div>{% endfor %}</div>{% endif %}{% endwith %}
{% block body %}{% endblock %}</body></html>
