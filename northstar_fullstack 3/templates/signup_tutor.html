{% extends 'base.html' %}{% block body %}<div class='form-page'><div class='form-head'><p class='eyebrow'>TUTOR APPLICATION</p><h1>Build your tutor profile.</h1><p>New tutor accounts require admin approval before appearing to students.</p></div><form class='form-grid' method='post' enctype='multipart/form-data'><label>Name<input name='name' required></label><label>Age<input name='age' type='number' min='16' required></label><label>Subjects<input name='subjects' placeholder='Math, Physics' required></label><label>Highest level taught<input name='highest_level' placeholder='IB / AP / CEGEP'></label><label>Format<select name='format'><option>Online</option><option>In person</option><option>Either</option></select></label><label>Tutoring type<select name='tutoring_type'><option>Paid</option><option>Volunteer</option><option>Paid and volunteer</option></select></label><label class='wide'>Qualifications<textarea name='qualifications' required></textarea></label><label class='wide'>Teaching style<textarea name='teaching_style'></textarea></label><label class='wide'>Photo (optional)<input type='file' name='photo' accept='image/*'></label><label>Email<input name='email' type='email' required></label><label>Password<input name='password' type='password' minlength='8' required></label><button class='btn dark wide'>Submit application</button></form></div>{% endblock %}
