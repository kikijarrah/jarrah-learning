services:
  - type: web
    name: northstar-tutoring
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_HOST_USER_ID
        sync: false
    disk:
      name: northstar-data
      mountPath: /app/data
      sizeGB: 1
