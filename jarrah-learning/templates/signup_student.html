{% extends 'base.html' %}{% block body %}<div class='form-page'><div class='form-head'><p class='eyebrow'>STUDENT SIGN UP</p><h1>Tell us what you need.</h1></div><form class='form-grid' method='post'><label>Name<input name='name' required></label><label>Grade<input name='grade' placeholder='Grade 11' required></label><label>Subject<input name='subject' placeholder='Mathematics' required></label><label>Course / level<input name='course_level' placeholder='IB Math AA HL' required></label><label>Preferred format<select name='format_pref'><option>Online</option><option>In person</option><option>Either</option></select></label><label>Tutor preference<select name='tutor_gender_pref'><option>No preference</option><option>Female tutor preferred</option><option>Male tutor preferred</option></select></label><label>Goal<input name='goal' placeholder='Improve my grade'></label><label>Target<input name='target' placeholder='85%+'></label><label class='wide'>Further notes<textarea name='notes' placeholder='Learning style, scheduling restrictions, personality preference...'></textarea></label><label>Email<input name='email' type='email' required></label><label>Password<input name='password' type='password' minlength='8' required></label><button class='btn dark wide'>Create account & match me</button></form></div>{% endblock %}
